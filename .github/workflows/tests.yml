name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q memlayer examples tests
      - name: Type check
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy --ignore-missing-imports memlayer
      - name: Clean install smoke test
        run: |
          python -m venv "$RUNNER_TEMP/lv-install"
          "$RUNNER_TEMP/lv-install/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/lv-install/bin/python" -m pip install .
          "$RUNNER_TEMP/lv-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lv-install/bin/python" -I -c "import memlayer; from importlib.resources import files; assert files('memlayer').joinpath('py.typed').is_file(); print('import ok:', len(memlayer.__all__), 'exports')"
